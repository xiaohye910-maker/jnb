name: Deploy to SiteGround

on:
  push:
    branches:
      - main
      - claude/import-siteground-github-ZpFH9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          # Normalize the secret: strip CRLF, ensure trailing newline.
          # GitHub's secret UI sometimes corrupts keys with Windows line
          # endings or strips the trailing newline OpenSSH requires.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed -e '$a\' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Validate the key parses before attempting to use it.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::SSH key in DEPLOY_SSH_KEY secret is malformed (libcrypto cannot parse it)."
            echo "First line of key file (sanity check):"
            head -1 ~/.ssh/deploy_key
            echo "Last line of key file:"
            tail -1 ~/.ssh/deploy_key
            echo "Byte count: $(wc -c < ~/.ssh/deploy_key)"
            exit 1
          fi
          echo "SSH key parsed OK."

          ssh-keyscan -p 18765 ssh.jnbhealth.com >> ~/.ssh/known_hosts 2>/dev/null

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 18765 -o StrictHostKeyChecking=yes" \
            --exclude='.git' \
            --exclude='php_errorlog' \
            --exclude='*.log' \
            --exclude='wp-config.php' \
            --exclude='wp-content/cache/' \
            --exclude='wp-content/upgrade/' \
            --exclude='wp-content/backup-db/' \
            --exclude='wp-content/uploads/' \
            public_html/ \
            u1050-0yzufsdczrls@ssh.jnbhealth.com:~/www/jnbhealth.com/public_html/
